name: Vitest Versions

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "test/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/vitest-versions.yaml"

permissions: {}

jobs:
  test:
    name: "test (vitest: ${{ matrix.vitest }})"
    strategy:
      matrix:
        vitest: ["3.0.0", "3.2.7", "4.0.0", "4.1.11", "5.0.0"]
      fail-fast: false
    uses: luxass/shared-workflows/.github/workflows/reusable-test.yaml@a80d13d310b91d509547203435ad21b68ae47ba1 # v0.12.0
    permissions:
      contents: read
    with:
      node-version: 24
      pre-test-script: "add --save-dev vitest@${{ matrix.vitest }} @vitest/coverage-v8@${{ matrix.vitest }}"
