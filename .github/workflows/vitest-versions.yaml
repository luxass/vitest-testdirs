name: Vitest Versions

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "test/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/vitest-versions.yaml"

permissions: {}

jobs:
  test:
    name: "test (vitest: ${{ matrix.vitest }}, vite: ${{ matrix.vite }})"
    strategy:
      matrix:
        include:
          - vitest: "3.0.0"
            vite: "6"
          - vitest: "3.2.7"
            vite: "6"
          - vitest: "4.0.18"
            vite: "7"
          - vitest: "4.1.11"
            vite: "8"
          - vitest: "5.0.0"
            vite: "8"
      fail-fast: false
    uses: luxass/shared-workflows/.github/workflows/reusable-test.yaml@9770f7268daf358179c45895de8becc2e8525984 # v0.14.0
    permissions:
      contents: read
    with:
      node-version: 24
      pre-test-script: "add --save-dev vitest@${{ matrix.vitest }} @vitest/coverage-v8@${{ matrix.vitest }} vite@${{ matrix.vite }}"
