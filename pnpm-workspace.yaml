ignoreScripts: true
minimumReleaseAge: 7200
trustPolicy: no-downgrade
catalogMode: prefer
strictDepBuilds: true
blockExoticSubdeps: true

minimumReleaseAgeExclude:
  - testdirs

catalogs:
  runtime:
    testdirs: 4.1.2
    zod: 4.6.5

  dev:
    oxfmt: 0.74.0
    oxlint: 1.87.0
    oxlint-tsgolint: 7.0.2005
    publint: 0.3.25
    tsdown: 0.23.2
    typescript: 7.0.2

  testing:
    "@vitest/coverage-v8": 5.0.3
    vitest: 5.0.3

  types:
    "@types/node": 26.6.5
