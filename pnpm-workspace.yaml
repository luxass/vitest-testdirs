ignoreScripts: true
minimumReleaseAge: 7200
trustPolicy: no-downgrade
catalogMode: prefer
strictDepBuilds: true
blockExoticSubdeps: true

minimumReleaseAgeExclude:
  - testdirs
  # Renovate security update: zod@4.6.6
  - zod@4.6.6

catalogs:
  runtime:
    testdirs: 4.1.2
    zod: 4.6.6

  dev:
    oxfmt: 0.72.0
    oxlint: 1.87.0
    oxlint-tsgolint: 7.0.2004
    publint: 0.3.25
    tsdown: 0.23.1
    typescript: 7.0.2

  testing:
    "@vitest/coverage-v8": 5.0.3
    vitest: 5.0.3

  types:
    "@types/node": 26.6.5
